name: ci

on:
  pull_request: {}
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: clippy,rustfmt

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --tests -- -D warnings

      - name: Install Linux sandbox dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap \
            --ro-bind / / \
            --proc /proc \
            --dev /dev \
            --unshare-user \
            --unshare-pid \
            --unshare-ipc \
            --unshare-uts \
            --die-with-parent \
            -- /bin/true

      - name: Prepare Windows sandbox reference
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\windows-smoke.ps1

      - name: Verify idempotent Windows job cleanup
        if: runner.os == 'Windows'
        run: cargo test --manifest-path vendor/codex-windows-sandbox/upstream/Cargo.toml --lib process::process_range_cleanup_tests::empty_job_cleanup_needs_only_query_access -- --exact

      - name: Verify stalled Windows Console cleanup first
        if: runner.os == 'Windows'
        run: cargo test --test execution_conformance sandboxed_stalled_console_output_cleans_owned_range_and_preserves_peer -- --include-ignored --exact

      - name: Run prepared Windows conformance
        if: runner.os == 'Windows'
        run: cargo test --all-targets -- --include-ignored

      - name: Run third-party Windows examples
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\windows-examples-smoke.ps1

      - name: Run tests
        if: runner.os != 'Windows'
        run: cargo test

      - name: Run portable conformance smoke
        if: runner.os == 'Linux' || runner.os == 'macOS'
        run: |
          cargo build --bin runseal
          python3 scripts/portable-probe-smoke.py

      - name: Check whitespace
        run: git diff --check

      - name: Run redaction scan
        shell: pwsh
        run: |
          $pattern = "tailos|tyclaw|myprojects|ferstar|private issue|private MR"
          $allowed = '^(./|.\\)?(AGENTS\.md|\.github[/\\]workflows[/\\]ci\.yml):'
          $files = Get-ChildItem -Recurse -File |
            Where-Object { $_.FullName -notmatch '[\\/]target[\\/]' }
          $matches = $files | Select-String -Pattern $pattern -CaseSensitive:$false |
            ForEach-Object {
              $path = Resolve-Path -Relative $_.Path
              "${path}:$($_.LineNumber):$($_.Line)"
            }
          $disallowed = $matches | Where-Object { $_ -and ($_ -notmatch $allowed) }

          if ($disallowed) {
            $disallowed | ForEach-Object { Write-Output $_ }
            exit 1
          }
